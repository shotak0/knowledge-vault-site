# knowledge-vault-site のビルドと GitHub Pages へのデプロイ
#
# このワークフローは public リポジトリ knowledge-vault-site に置く。

name: Deploy to GitHub Pages

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

env:
  # Astro のテレメトリ（匿名の利用状況データの収集）を無効にする。
  ASTRO_TELEMETRY_DISABLED: '1'

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: リポジトリを取得する
        uses: actions/checkout@v5

      - name: Node.js をセットアップする
        uses: actions/setup-node@v6
        with:
          node-version: '24'
          cache: npm

      - name: 依存関係をインストールする
        run: npm ci

      - name: サイトをビルドする
        run: npm run build

      - name: Pages を設定する
        uses: actions/configure-pages@v5
        with:
          # Pages がまだ有効になっていない場合、自動で有効にする。
          enablement: true

      - name: 成果物をアップロードする
        uses: actions/upload-pages-artifact@v4
        with:
          path: dist/

      - name: GitHub Pages にデプロイする
        id: deployment
        uses: actions/deploy-pages@v5
